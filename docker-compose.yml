version: "3.9"

networks:
  dwh_network:
    driver: bridge

volumes:
  postgres_data:

services:

  # ══════════════════════════════════════════════════════════
  # 1. PostgreSQL Lakehouse / DWH
  # ══════════════════════════════════════════════════════════
  postgres:
    image: postgres:15
    container_name: dwh_postgres
    restart: always
    environment:
      POSTGRES_USER: dwh_user
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: ecommerce_dwh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dwh_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwh_user -d ecommerce_dwh"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ══════════════════════════════════════════════════════════
  # 2. Batch ETL Pipeline with NLP Sentiment Analysis
  # ══════════════════════════════════════════
  etl:
    build: ./pipelines/batch
    container_name: dwh_batch_etl
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: dwh_user
      DB_PASS: "12345"
      DB_NAME: ecommerce_dwh
      CSV_PATH: /data/amazon.csv
    volumes:
      - ./amazon.csv:/data/amazon.csv:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dwh_network
    command: python main.py

  # ══════════════════════════════════════════════════════════
  # 3. Backend API (FastAPI)
  # ══════════════════════════════════════════════════════════
  api:
    build: ./backend
    container_name: dwh_api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: dwh_user
      DB_PASS: "12345"
      DB_NAME: ecommerce_dwh
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    networks:
      - dwh_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ══════════════════════════════════════════════════════════
  # 4. Frontend Dashboard (React 19 + Vite)
  # ══════════════════════════════════════════════════════════
  frontend:
    build: ./frontend
    container_name: dwh_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - dwh_network

  # ══════════════════════════════════════════════════════════
  # 5. Apache Kafka & Zookeeper
  # ══════════════════════════════════════════════════════════
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: dwh_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - dwh_network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: dwh_kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    networks:
      - dwh_network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-version --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ══════════════════════════════════════════════════════════
  # 6. Real-Time Producers
  # ══════════════════════════════════════════════════════════
  amazon-producer:
    build: ./pipelines/streaming
    container_name: dwh_amazon_producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PRODUCTS: amazon.products
      COUNT: 100
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dwh_network
    command: python producers/amazon_producer.py

  ecommerce-producer:
    build: ./pipelines/streaming
    container_name: dwh_ecommerce_producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_EVENTS: ecommerce.events
      CSV_PATH: /data/amazon.csv
      COUNT: 200
    volumes:
      - ./amazon.csv:/data/amazon.csv:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dwh_network
    command: python producers/ecommerce_producer.py

  # ══════════════════════════════════════════════════════════
  # 7. Streaming Consumer (Funnel & GMV Windowing)
  # ══════════════════════════════════════════════════════════
  kafka-consumer:
    build: ./pipelines/streaming
    container_name: dwh_kafka_consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PRODUCTS: amazon.products
      KAFKA_TOPIC_EVENTS: ecommerce.events
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: dwh_user
      DB_PASS: "12345"
      DB_NAME: ecommerce_dwh
      WINDOW_SECONDS: 20
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - dwh_network
    command: python consumer/kafka_consumer.py